<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:">
<title>这一餐，选得明白 · MCD FIT PLANNER</title>
<style>
:root{color-scheme:light;--paper:#f5f1e7;--ink:#27231e;--muted:#766d60;--line:#ddd5c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.8 'Microsoft YaHei',sans-serif}main{max-width:1150px;padding:48px 28px 70px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px;font-size:11px;letter-spacing:2px}h1{font:400 clamp(36px,6vw,64px)/1.4 'SimSun',serif;letter-spacing:-1px;margin:40px 0 16px}h2{font-size:20px;line-height:1.6;margin:12px 0;overflow-wrap:anywhere}p{margin:8px 0}.muted,small{color:var(--muted)}.intro{max-width:680px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:32px 0 12px}input,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:99px;background:#fffaf2;padding:9px 18px}input{width:145px}button{cursor:pointer}button:hover{background:#e9e0d1}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b7654;outline-offset:3px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px;margin:25px 0 40px}.card{background:#fffcf6;border:1px solid var(--line);border-radius:26px;padding:25px;min-width:0}.price{font:400 48px/1.4 Georgia,serif;letter-spacing:-2px}.tag{font-size:11px;color:var(--muted)}.balance{display:inline-block;background:#eee7db;border-radius:99px;padding:3px 12px;font-size:13px}.over{color:#925a3d}.foods{padding-left:18px;font-size:13px}.nutrition{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.nutrition small{display:block;font-size:11px}.nutrition b{font-size:16px;font-weight:500}select{max-width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fffcf6}.compare{border:1px solid var(--line);border-radius:26px;padding:26px}.pickers{display:flex;gap:15px;flex-wrap:wrap;margin:16px 0}.pickers label{display:grid;gap:6px;flex:1;min-width:200px}.delta{padding:16px 0;border-top:1px solid var(--line)}#copy-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#notice,#coverage{font-size:12px}footer{font-size:12px;margin-top:30px;color:var(--muted)}@media(max-width:600px){main{padding:25px 18px}header{letter-spacing:0;flex-direction:column;gap:4px}.card,.compare{padding:22px}h1{margin-top:30px}.pickers label{min-width:0;width:100%;flex-basis:100%}}@media(prefers-reduced-motion:no-preference){button{transition:background .2s}}
select{min-width:0;width:100%;text-overflow:ellipsis}.pickers label{min-width:0}
</style>
<main><header><span>MCD FIT PLANNER / 选餐手账</span><span>$label</span></header>
<h1>这一餐，选得明白。</h1><p class="intro muted">预算还剩多少，多花的钱换来了什么。把本次已核价的餐单摆在一起，也看看热量、蛋白质、碳水和脂肪。</p>
<div class="controls"><label>这餐预算 ¥ <input id="budget" type="number" min="0" step="0.01" value="$budget"></label><button id="reset" type="button">恢复计划预算</button></div>
<p id="status" aria-live="polite"></p><p id="target" class="muted"></p><p id="coverage" class="muted"></p><p id="notice" class="muted"></p><div id="cards"></div>
<section class="compare"><div class="tag">换一份之前 / 比一比</div><h2>差价，看整餐；变化，看组成。</h2><div class="pickers"><label>原方案<select id="before"></select></label><label>对比方案<select id="after"></select></label></div><div id="difference"></div><button type="button" id="copy">复制所选餐单</button><p id="copy-status" aria-live="polite"></p><div id="copy-text"></div></section>
<footer>调预算仅筛选已有候选，不改配方、不重新计价。实际价格需回到 Agent 查询；超预算参考须先调整计划并重新推荐、核价和确认。本页没有下单功能。<noscript>请启用 JavaScript 查看本地比较；本页不联网。</noscript></footer></main>
<script id="report-data" type="application/json">$data</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent),el=id=>document.getElementById(id),money=c=>'¥'+(c/100).toFixed(2);
const nutrients=[['kcal','热量','kcal'],['protein_g','蛋白质','g'],['carb_g','碳水','g'],['fat_g','脂肪','g']];
function amount(p,n){const v=p.nutrition[n],b=p.bounds[n];return v!=null?(p.estimated?'约 ':'')+v:b&&b.max!=null?'估算 '+b.min+'–'+b.max:b?'≥'+b.min+' · 待补全':'未知'}
function freshness(p){if(data.kind==='demo')return '合成数据 · 非真实售价';const t=Date.parse(p.quoted_at),age=Date.now()-t,cn=new Date(Date.now()+8*3600000).toISOString().slice(0,10);return age<0?'时间异常 · 请重新计价':age>900000||cn!==data.day?'历史报价 · 请重新计价':'本轮报价快照 · 下单前仍须重新计价'}
function row(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=text;return n}
function draw(){const raw=el('budget').value.trim(),v=Number(raw);if(raw===''||!Number.isFinite(v)||v<0||Math.abs(v*100-Math.round(v*100))>1e-6){el('status').textContent='请输入非负金额，最多两位小数。';el('cards').replaceChildren();return}const budget=Math.round(v*100),within=data.plans.filter(p=>p.price<=budget),cheapest=[...data.plans].sort((a,b)=>a.price-b.price)[0];
el('status').textContent=within.length?'展示候选中有 '+within.length+' 份在预算内。':cheapest?'展示候选均超预算；最接近的是 '+money(cheapest.price)+'，超出 '+money(cheapest.price-budget)+'，仅供调整预算参考。':'本轮没有符合营养与餐品要求的已核价方案。';
el('coverage').textContent='本轮已核价 '+data.coverage.priced_count+' 份，未核价 '+data.coverage.unquoted_count+' 份，失败 '+data.coverage.quote_failure_count+' 项。页面仅展示推荐与最多三份超预算参考。';
el('notice').textContent=data.scope+' '+data.warnings.join('；');el('cards').replaceChildren();
data.plans.forEach((p,i)=>{const card=row('article','card','');card.append(row('div','tag',p.labels.join(' / ')),row('h2','',p.title),row('div','price',money(p.price)),row('span','balance'+(p.price>budget?' over':''),(p.price>budget?'超出 ':'剩余 ')+money(Math.abs(budget-p.price))));const ul=row('ul','foods','');p.items.forEach(x=>ul.append(row('li','',x.name+' ×'+x.quantity)));card.append(ul);const n=row('div','nutrition','');nutrients.forEach(([key,name,unit])=>{const cell=row('div','','');cell.append(row('small','',name),row('b','',amount(p,key)+' '+unit));n.append(cell)});card.append(n,row('p','tag',freshness(p)),row('p','tag','核价时间 '+p.quoted_at));el('cards').append(card)});
}
function diff(){const a=data.plans[Number(el('before').value)],b=data.plans[Number(el('after').value)];el('difference').replaceChildren();el('copy-text').textContent='';el('copy-status').textContent='';if(!a||!b){el('difference').textContent='没有可比较的已核价方案。';return}const change=b.price-a.price;el('difference').append(row('p','delta','整餐应付：'+money(a.price)+' → '+money(b.price)+'（'+(change>=0?'增加 ':'减少 ')+money(Math.abs(change))+'）'));
const am=new Map(a.items.map(x=>[x.id,x])),bm=new Map(b.items.map(x=>[x.id,x]));for(const [label,mode] of [['增加',1],['减少',-1],['保持',0]]){const parts=[];for(const id of new Set([...am.keys(),...bm.keys()])){const x=am.get(id),y=bm.get(id),aq=x?.quantity||0,bq=y?.quantity||0,q=mode===0?Math.min(aq,bq):mode===1?bq-aq:aq-bq;if(q>0)parts.push((y||x).name+' ×'+q)}el('difference').append(row('p','',label+'：'+(parts.join('；')||'无')))}
nutrients.forEach(([n,name,unit])=>{const av=a.nutrition[n],bv=b.nutrition[n];el('difference').append(row('p','muted',name+'：'+amount(a,n)+' → '+amount(b,n)+' '+unit+(av!=null&&bv!=null?'（差值 '+(b.estimated||a.estimated?'约 ':'')+(bv-av>=0?'+':'')+Math.round((bv-av)*100)/100+'）':'（缺失或区间，不计算确定差值）')))});
el('difference').append(row('p','tag','差价为整餐价差，不是新增单品售价；组成或条件变化须重新核价并确认。'));
el('copy-text').textContent=b.title+'\n'+b.items.map(x=>x.name+' ×'+x.quantity).join('；')+'\n应付快照 '+money(b.price)+'\n'+nutrients.map(([n,name,u])=>name+' '+amount(b,n)+' '+u).join(' / ')+'\n'+freshness(b)+'\n核价时间 '+b.quoted_at+'\n'+data.scope;
}
for(const id of ['before','after']){data.plans.forEach((p,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=p.title+' / '+money(p.price);el(id).append(opt)});el(id).addEventListener('change',diff)}
if(data.plans.length>1)el('after').value='1';el('budget').addEventListener('input',draw);el('reset').addEventListener('click',()=>{el('budget').value=(data.budget/100).toFixed(2);draw()});
el('target').textContent='沿用的本餐目标：'+(nutrients.flatMap(([n,name,u])=>{const a=data.target[n+'_min'],b=data.target[n+'_max'];return a==null&&b==null?[]:[name+' '+(a!=null&&b!=null?a+'–'+b:a!=null?'≥'+a:'≤'+b)+' '+u]}).join('；')||'未设置个人目标，不能判断健身达标。');
el('copy').addEventListener('click',async()=>{diff();const text=el('copy-text').textContent;if(!text){el('copy-status').textContent='暂无可复制餐单';return}try{await navigator.clipboard.writeText(text);el('copy-status').textContent='已复制';}catch{el('copy-status').textContent='浏览器未允许剪贴板，可选中下方文字手动复制。'}});
draw();diff();setInterval(draw,30000);
</script></html>
